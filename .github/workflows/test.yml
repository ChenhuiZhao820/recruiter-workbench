name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # The suite builds its own SQLite database and never touches dev data.
      DATABASE_URL: "file:./test.db"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      # Only Chromium: the suite runs one project, so the other browsers are
      # download time for nothing.
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      # No ANTHROPIC_API_KEY is set or needed. The suite points the SDK at a
      # local stub via ANTHROPIC_BASE_URL, so it makes no external calls.
      - name: Run tests
        run: npm test

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
